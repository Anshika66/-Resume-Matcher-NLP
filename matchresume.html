<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Matcher</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">


    <style>
        /* ===== GLOBAL BACKGROUND ===== */
        body {
            min-height: 100vh;
            background: radial-gradient(circle at top left, #1f3c4a, #050b12 70%);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #eaeaf0;
        }

        .container { max-width: 850px; }

        .card {
            background: linear-gradient(145deg, rgba(30, 30, 55, 0.85), rgba(15, 15, 30, 0.95));
            backdrop-filter: blur(18px);
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7),
                        inset 0 0 0.5px rgba(255, 255, 255, 0.15);
            overflow: hidden;
            animation: float 6s ease-in-out infinite;
        }

        .result-box {
            margin-top: 25px;
            padding: 22px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(22,119,255,0.25), rgba(122,44,255,0.25));
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .result-box h5 {
            font-weight: 700;
            margin-bottom: 18px;
            color: #ffffff;
            text-align: center;
        }

        .result-box ul { list-style: none; padding: 0; }

        .result-box li {
            background: rgba(255,255,255,0.08);
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .result-box li:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(120,90,255,0.6);
        }

        .score-badge {
            background: linear-gradient(90deg, #1677ff, #7a2cff);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        .card-header {
            background: linear-gradient(90deg, #1677ff, #6f2cff);
            padding: 22px;
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            color: #ffffff;
        }

        .card-body { padding: 35px; }

        .btn-primary {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 14px;
            border: none;
            background: linear-gradient(90deg, #1677ff, #7a2cff);
        }

        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0); }
        }
    </style>
</head>

<body>
<div class="container">
    <div class="card">

        <div class="card-header">
            Job Description & Resume Matcher
        </div>

        <div class="card-body">
            <form action="/matcher" method="post" enctype="multipart/form-data">

                <div class="form-group">
                    <label>Job Description</label>
                    <textarea class="form-control" name="job_description" rows="5"
                              placeholder="Paste the job description here..."></textarea>
                </div>

                <div class="form-group">
                    <label>Upload Resumes</label>
                    <p>Please upload more than 5 resumes (PDF, DOCX, or TXT).</p>
                    <input type="file" class="form-control" name="resumes"
                           multiple required accept=".pdf,.docx,.txt">
                </div>

                <button type="submit" class="btn btn-primary">
                    Match Resume
                </button>
            </form>


            {% if top_resumes and similarity_scores %}
            <div class="result-box">
                <h5>Top Matching Resumes</h5>

                <ul>
                    {% for i in range(top_resumes|length) %}
                    <li>
                        <span>{{ top_resumes[i] }}</span>
                        <span class="score-badge">{{ similarity_scores[i] }}%</span>
                    </li>
                    {% endfor %}
                </ul>
            </div>
            {% endif %}

        </div>
    </div>
</div>
</body>
</html>
